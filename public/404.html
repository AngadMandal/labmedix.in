<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LabMedix</title>
    <script>
      // GitHub Pages & Static SPA — redirect all 404s back to index with hash
      var base = window.location.pathname.startsWith('/labmedix.in') ? '/labmedix.in' : '';
      var path = (base ? window.location.pathname.replace(base, '') : window.location.pathname).replace(/^\//, '');
      var search = window.location.search;
      var hash = window.location.hash;
      var redirectUrl = window.location.origin + (base ? base : '') + '/' + search + (path ? '#/' + path : '') + hash;
      window.location.replace(redirectUrl);
    </script>
  </head>
  <body></body>
</html>
